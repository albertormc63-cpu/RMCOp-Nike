<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>RMC Nike Panel</title>
    <link rel="stylesheet" href="./css/styles.css">
    <script>
        // Diagnostico temprano: si CEP truena antes de pintar la UI, mostramos el error en el panel.
        (function () {
            function showBootError(message) {
                var render = function () {
                    var box = document.getElementById("bootError");

                    if (!box) {
                        box = document.createElement("pre");
                        box.id = "bootError";
                        box.style.cssText = [
                            "position:fixed",
                            "inset:8px",
                            "z-index:99999",
                            "overflow:auto",
                            "white-space:pre-wrap",
                            "background:#1f1111",
                            "color:#ffd7d7",
                            "border:1px solid #a94442",
                            "border-radius:6px",
                            "padding:10px",
                            "font:12px/1.4 Menlo,Consolas,monospace"
                        ].join(";");
                        document.body.appendChild(box);
                    }

                    box.textContent += message + "\n";
                };

                if (document.body) {
                    render();
                } else {
                    document.addEventListener("DOMContentLoaded", render);
                }
            }

            window.addEventListener("error", function (event) {
                showBootError([
                    "ERROR DE ARRANQUE DEL PANEL",
                    event.message || "Sin mensaje",
                    event.filename || "Archivo desconocido",
                    "Linea: " + (event.lineno || "?") + " Columna: " + (event.colno || "?")
                ].join("\n"));
            });

            window.addEventListener("unhandledrejection", function (event) {
                var reason = event.reason && (event.reason.stack || event.reason.message || event.reason);
                showBootError("PROMESA RECHAZADA:\n" + reason);
            });
        })();
    </script>
</head>

<body>
    <!-- Header fijo del panel: marca, subtitulo y reinicio rapido de UI. -->
    <header class="app-header">
        <div class="header-logo-slot header-logo-left">
            <img src="./assets/logo rmc m.svg" alt="RMC" class="header-logo header-logo-rmc">
        </div>

        <div class="header-logo-slot header-logo-center">
            <img src="./assets/logo nike.svg" alt="Nike" class="header-logo header-logo-nike">
        </div>

        <div class="header-actions">
            <img src="./assets/logo rmc x nike.svg" alt="RMC x Nike" class="header-logo header-logo-rmc-nike">
            <button id="btnResetPanel" class="icon-button" title="Reiniciar panel">↻</button>
        </div>
    </header>

    <!-- Navegacion principal del flujo: equipo -> pedido -> proceso -> rutas. -->
    <nav class="step-nav" aria-label="Flujo del pedido">
        <button class="step-button active" data-page="pageTeams">1 Equipo</button>
        <button class="step-button" data-page="pageOrder">2 Pedido</button>
        <button class="step-button" data-page="pageProcess">3 Proceso</button>
        <button class="step-button" data-page="pageSettings">Rutas</button>
    </nav>

    <main>
        <!-- Paso 1: seleccion de linea y equipo. El grid se pinta desde js/ui/teamsView.js. -->
        <section id="pageTeams" class="page active">
            <div class="section-heading section-heading-row">
                <h1>Selecciona equipo</h1>
                <label class="line-field">
                    Linea
                    <select id="productLineSelect">
                        <option value="masculino" selected>Masculino</option>
                        <option value="femenino">Femenino</option>
                    </select>
                </label>
            </div>

            <div id="teamGrid" class="team-grid"></div>
        </section>

        <!-- Paso 2: datos variables del pedido. Se leen desde js/ui/orderView.js. -->
        <section id="pageOrder" class="page">
            <div class="selected-summary">
                <div id="selectedPreview" class="selected-preview"></div>
                <div>
                    <span class="eyebrow">Equipo seleccionado</span>
                    <h1 id="selectedTeamName">Sin equipo</h1>
                    <label class="variant-field">
                        Variante
                        <select id="variantSelect"></select>
                    </label>
                    <div class="version-toggle" role="group" aria-label="Version">
                        <label>
                            <input type="radio" name="version" value="Home" checked>
                            Home
                        </label>
                        <label>
                            <input type="radio" name="version" value="Away">
                            Away
                        </label>
                    </div>
                </div>
            </div>

            <div class="form-grid">
                <label>
                    Work Order
                    <input type="text" id="wo" inputmode="numeric" pattern="[0-9-]*" placeholder="Ej. 172539">
                </label>

                <label>
                    Style
                    <select id="styleCode"></select>
                </label>

                <label>
                    Talla
                    <select id="size">
                        <option value="XS">XS</option>
                        <option value="SM" selected>SM</option>
                        <option value="MD">MD</option>
                        <option value="LG" >LG</option>
                        <option value="XL">XL</option>
                        <option value="2X">2X</option>
                        <option value="3X">3X</option>
                    </select>
                </label>

                <label>
                    Numero
                    <input type="text" id="playerNumber" inputmode="numeric" pattern="[0-9]*" placeholder="Ej. 7">
                </label>

                <label class="wide-field">
                    Nombre
                    <input type="text" id="playerName" placeholder="Opcional">
                </label>

                <label class="wide-field destination-field">
                    Carpeta On Demand / destino
                    <div class="folder-picker-row">
                        <select id="demandFolder">
                            <option value="NIKE ON DEMAND 8 MAYO">NIKE ON DEMAND 8 MAYO</option>
                            <option value="NIKE ON DEMAND 15 MAYO">NIKE ON DEMAND 15 MAYO</option>
                            <option value="NIKE ON DEMAND 22 MAYO" selected>NIKE ON DEMAND 22 MAYO</option>
                        </select>
                        <button type="button" id="btnChooseDestination" class="secondary-button">Examinar</button>
                        <button type="button" id="btnClearDestination" class="secondary-button hidden">Limpiar</button>
                    </div>
                    <div id="customDestinationPreview" class="destination-note">Usando carpeta On Demand seleccionada.</div>
                </label>
            </div>

            <button id="btnReviewOrder" class="primary-button">Revisar pedido</button>
        </section>

        <!-- Paso 3: revision, copia de plantilla y envio a Illustrator. -->
        <section id="pageProcess" class="page">
            <div class="section-heading">
                <h1>Revisar y procesar</h1>
            </div>

            <div class="review-panel">
                <div>
                    <span class="eyebrow">Plantilla</span>
                    <p id="templatePathPreview" class="path-preview">Pendiente</p>
                </div>
                <div>
                    <span class="eyebrow">Archivo final</span>
                    <p id="outputNamePreview" class="path-preview">Pendiente</p>
                </div>
                <div>
                    <span class="eyebrow">Destino</span>
                    <p id="destinationPreview" class="path-preview">Pendiente</p>
                </div>
            </div>

            <button id="btnCrearCopia" class="primary-button">Crear copia de plantilla</button>
            <button id="btnAbrirAplicar">Abrir y aplicar datos</button>
        </section>

        <!-- Vista de apoyo para confirmar rutas activas local/server. -->
        <section id="pageSettings" class="page">
            <div class="section-heading">
                <h1>Rutas</h1>
            </div>

            <div class="settings-list">
                <div>
                    <span class="eyebrow">Modo</span>
                    <p id="modePreview">Pendiente</p>
                </div>
                <div>
                    <span class="eyebrow">Templates</span>
                    <p id="templatesBasePreview" class="path-preview">Pendiente</p>
                </div>
                <div>
                    <span class="eyebrow">Ordenes</span>
                    <p id="ordersBasePreview" class="path-preview">Pendiente</p>
                </div>
            </div>

            <button id="btnExtractOfficialSwatches" class="primary-button">Extraer muestras oficiales</button>
            <button id="btnValidateOfficialSwatches" class="secondary-button settings-action">Validar muestras de documento</button>
        </section>
    </main>

    <!-- Consola visible del panel: js/logger.js redirige console.log/warn/error aqui. -->
    <section id="log-container">
        <div class="log-header">
            Log de Consola
            <button id="btnClearLog">Limpiar</button>
        </div>
        <div id="terminal"></div>
    </section>

    <footer class="footer-credits">
        Creado por Jose Alberto Villarreal Garcia
    </footer>

    <!-- Orden importante: primero vendor/logger/catalogos, luego UI/Illustrator, al final main.js. -->
    <script src="./js/CSInterface.js"></script>
    <script src="./js/logger.js"></script>
    <script src="./js/config/productCatalog.js"></script>
    <script src="./js/services/nodeServices.js"></script>
    <script src="./js/ui/previewView.js"></script>
    <script src="./js/ui/teamsView.js"></script>
    <script src="./js/ui/orderView.js"></script>
    <script src="./js/illustrator/textRules.js"></script>
    <script src="./js/illustrator/illustratorBridge.js"></script>
    <script src="./js/main.js"></script>
</body>
</html>
